# Publishes the site in docs/ to GitHub Pages.
# The demo on the site uses the wallpapers from the app, so the workflow copies them in.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "app/src/main/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r docs/. _site/
          cp -r app/src/main/assets/walls _site/walls
          cp app/src/main/assets/hands.webp _site/hands.webp

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
